name: Lint

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
<% if (data.packageManager === "pnpm") { -%>
            - uses: pnpm/action-setup@v4
<% } -%>
<% if (data.packageManager === "bun") { -%>
            - uses: oven-sh/setup-bun@v2
<% } -%>
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
<% if (data.packageManager !== "bun") { -%>
                  cache: "<%= data.packageManager %>"
<% } -%>
<% if (data.packageManager === "npm") { -%>
            - run: npm ci
<% } else { -%>
            - run: <%= data.packageManager %> install --frozen-lockfile
<% } -%>
            - run: <%= data.packageManager %> run build
            - run: <%= data.packageManager %> run lint
